[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-lntools"
version = "0.12.0"
description = "ln-structure checker, blast radius, doc generator and Claude Code hooks for Python and Rust"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.25", "tree-sitter-rust>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lnt = "lntools.l4.cli:Cli.main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lntools = ["**/*.md", "protocol/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
